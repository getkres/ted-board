name: Offline safeguard patches

on:
  pull_request:
    paths:
      - 'runner-fix/safeguard-tools.patch'
      - 'runner-fix/bounded-watchdog-log.patch'
      - 'runner-fix/fixtures/job_watchdog.py'
      - 'runner-fix/bottleneck_safeguards_test.py'
      - '.github/workflows/ops-safeguards.yml'
  push:
    branches: [main]
    paths:
      - 'runner-fix/safeguard-tools.patch'
      - 'runner-fix/bounded-watchdog-log.patch'
      - 'runner-fix/fixtures/job_watchdog.py'
      - 'runner-fix/bottleneck_safeguards_test.py'
      - '.github/workflows/ops-safeguards.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 runner-fix/bottleneck_safeguards_test.py
