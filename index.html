rder-radius:8px;margin:14px 0;background:var(--raised)}.options{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.option{border-color:#805b30;color:#ffd49b;background:#302317;flex-grow:1}.option:hover:not(:disabled){background:#44301c}.note-form{display:flex;gap:8px;align-items:stretch;margin-top:14px}.note-form textarea{flex:1;resize:vertical;min-width:0;min-height:44px;height:44px;max-height:160px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#1b1511;color:var(--text);font-size:.8125rem;line-height:1.4}.note-form textarea::placeholder{color:#af967e}.note-form button{font-size:.8rem;padding:10px 12px}.card-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.delegate{font-size:.78rem;padding:10px 4px!important;min-height:44px}.play{display:flex;align-items:center;gap:6px;font-size:.75rem;border-color:#65503b;padding:10px 12px}.play svg{width:12px;height:12px;fill:var(--accent);stroke:none}.answer{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;font-size:.8rem;line-height:1.5;display:flex;gap:10px;align-items:baseline;justify-content:space-between}.answer p{color:var(--text);white-space:pre-line}.sent{white-space:nowrap;color:var(--green);font-size:.7rem}.empty-section{color:var(--muted);font-size:.8rem;padding:6px 0 12px;line-height:1.5}.killed{border-top:1px solid var(--line);padding-top:12px}.killed summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--muted);list-style:none}.killed summary::-webkit-details-marker{display:none}.killed summary:after{content:"+";margin-left:auto;font-size:1.3rem}.killed[open] summary:after{content:"−"}.killed .card{margin-top:14px}.status{font-size:.85rem;line-height:1.5;color:var(--muted)}#notice:empty{display:none}#notice{padding:12px 14px;background:var(--raised);border:1px solid var(--line);border-radius:10px;margin:18px 0}.status.error{color:var(--red)}.state{padding:32px 4px;max-width:500px}.state h2{margin-bottom:12px}.state p{color:var(--muted);line-height:1.6;font-size:.9rem}.state button{margin-top:20px}.loading{padding:50px 0;color:var(--muted);font-size:.9rem}.key-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.key-form input{flex:1;min-width:150px;min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:12px}.key-form button{margin:0}footer{padding:20px 0 max(28px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:.72rem}.footer-mark{color:var(--accent)}.access-button{font-size:.72rem;padding:8px 0;border:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media(min-width:700px){.shell{padding:0 36px}.masthead{padding-top:36px;padding-bottom:30px}.board-intro{margin:30px 0 28px}.board.all{grid-template-columns:repeat(2,minmax(0,1fr))}.board.all .section{display:contents}.board.all .section-heading{grid-column:1/-1;margin-bottom:0}.board.all .card{margin:0}.card{padding:22px}.guide-shell{padding:34px 40px}.guide-content{padding-top:50px}}@media(min-width:1100px){.board:not(.all){grid-template-columns:repeat(4,minmax(0,1fr));align-items:start;gap:18px}.board.all{grid-template-columns:repeat(3,minmax(0,1fr))}.board>.killed{grid-column:1/-1}.board>.killed[open]{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.board>.killed summary{grid-column:1/-1}.card{padding:18px}}@media(prefers-reduced-motion:no-preference){button,a{transition:background-color .12s ease}dialog[open]{animation:enter .16s ease-out}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}}
.reply-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);vertical-align:middle;margin-left:6px;flex-shrink:0}.card-unread{margin:0 auto 0 0}.thread{border-top:1px solid var(--line);margin-top:16px;padding-top:10px}.thread-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:.72rem}.thread-head button,.thread-toggle{font-size:.72rem;padding:8px 4px}.messages{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0;margin:8px 0 0}.message{font-size:.8rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}.message-ted{border-left:2px solid var(--accent);padding:3px 0 3px 11px}.message-label{display:block;color:var(--accent);font-size:.65rem;letter-spacing:.04em;margin-bottom:3px}.message-seb{align-self:flex-end;text-align:right;color:var(--muted);padding:3px 0 3px 20px}.thread-toggle{margin-top:4px}
.job-list{display:grid;gap:14px;max-width:850px}.job-meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.8rem;margin-top:12px}.job-actions{display:flex;gap:10px;margin-top:14px}.approval{margin-top:16px;padding:14px;border:1px solid #805b30;border-radius:10px}.approval p{font-size:.85rem;line-height:1.5}.approval details{margin-top:10px}.approval summary{cursor:pointer;display:flex;align-items:center;font-size:.8rem;color:var(--accent)}.approval pre{max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.75rem;line-height:1.5}.job-warning{color:var(--red);font-size:.8rem;margin:12px 0}

<body>
<div class="shell">
<header class="masthead"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><h1>Ted Board</h1><p>tap it, i'll handle the rest.</p></div></div><button class="icon-button" id="refresh" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></svg></button></header>
<nav class="tab-wrap" aria-label="Projects"><div class="tabs" role="tablist" aria-label="Projects" id="tabs"></div></nav>
<div id="notice" class="status" role="status" aria-live="polite"></div>
<main id="main" role="tabpanel" tabindex="-1"><p class="loading">Opening your board…</p></main>
<footer><span><span class="footer-mark" aria-hidden="true">●</span> you pick, i do the rest.</span><button id="change-key" class="quiet access-button">Access</button></footer>
</div>
<dialog id="guide" aria-labelledby="guide-heading"><div class="guide-shell"><div class="guide-header"><span class="guide-project" id="guide-project"></span><button class="icon-button" id="guide-close" aria-label="Close guided mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><h2 class="guide-title" id="guide-heading"></h2><div class="progress-track" id="guide-progress" aria-hidden="true"></div><div class="guide-content"><p class="step-count" id="step-count"></p><p class="step-text" id="step-text" tabindex="-1"></p><div id="guide-link"></div><div class="guide-note"><label for="step-note">stuck? tell me why (optional)</label><textarea id="step-note" maxlength="1900" placeholder="what's in the way?"></textarea></div><p class="status guide-status" id="guide-status" role="status" aria-live="polite"></p></div><div class="guide-actions"><button id="guide-back">Back</button><button class="primary" id="guide-next">Done, next</button></div><button class="quiet stuck" id="guide-stuck">Stuck</button><p class="paused" id="guide-save-status">close anytime, i'll keep your spot.</p></div></dialog>
<noscript><div class="shell state"><h2>JavaScript is needed</h2><p>Open this link in Safari or Chrome to use your board.</p></div></noscript>
<script src="mockups.js"></script>
<script>
'use strict';
const ENDPOINT='https://wqnrortftkffmbeugjky.supabase.co/functions/v1/ted-board';
const PROJECTS=['Fictora','Bookish','Kres + clients','Lunair + art','Ted ops'];
const SECTIONS=[['needs_you','Needs you'],['ted_doing',"Ted’s doing"],['up_next','Up next'],['done','Done']];
const $=id=>document.getElementById(id);
const state={cards:[],jobs:[],approvals:[],jobsLoaded:false,jobsLoading:false,project:'All',loaded:false,loading:false,busy:new Set(),drafts:Object.create(null),guide:null,revision:0,threads:new Set(),readCards:new Set()};
const memory=new Map();let storageUnavailable=false;
const storage={get(k){try{return localStorage.getItem(k)??memory.get(k)??null}catch{storageUnavailable=true;return memory.get(k)??null}},set(k,v){memory.set(k,v);try{localStorage.setItem(k,v);return true}catch{storageUnavailable=true;return false}},remove(k){memory.delete(k);try{localStorage.removeItem(k)}catch{storageUnavailable=true}}};
let key=storage.get('ted-board-key')||'';
const fragmentKey=new URLSearchParams(location.hash.slice(1)).get('k');
if(fragmentKey){key=fragmentKey;if(storage.set('ted-board-key',key))history.replaceState(null,'',location.pathname+location.search)}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function button(text,cls,fn){const b=el('button',cls,text);b.type='button';b.addEventListener('click',fn);return b}
function safeURL(raw){try{const u=new URL(raw);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function announce(text,error=false){$('notice').textContent=text;$('notice').className='status'+(error?' error':'')}
function options(card){return (Array.isArray(card.options)?card.options:[]).slice(0,4).map(o=>typeof o==='string'?{label:o,value:o}:o).filter(o=>o&&typeof o.label==='string'&&typeof o.value==='string')}
function steps(card){return (Array.isArray(card.steps)?card.steps:[]).filter(s=>s&&typeof s.text==='string')}
function projectCards(){return state.cards.filter(c=>state.project==='All'?c.section==='needs_you':c.project===state.project)}
function recent(c){const t=Date.parse(c.updated_at);return Number.isFinite(t)&&t>=Date.now()-7*86400000}
function messages(card){return (Array.isArray(card.messages)?card.messages:[]).filter(m=>m&&['seb','ted'].includes(m.who)&&typeof m.text==='string')}
function replyMarker(card){const ted=messages(card).filter(m=>m.who==='ted');const m=ted.at(-1);return m?JSON.stringify([ted.length,m.at,m.text]):''}
function unread(card){const marker=replyMarker(card);return !!marker&&storage.get('ted-board-read:'+card.id)!==marker}
function replyDot(cls=''){const dot=el('span','reply-dot'+(cls?' '+cls:''));dot.setAttribute('role','img');dot.setAttribute('aria-label','Unread replies from Ted');return dot}
function markRepliesRead(card){state.readCards.add(card.id);storage.set('ted-board-read:'+card.id,replyMarker(card));render()}
function renderThread(card){
 const list=messages(card);if(!list.length)return null;
 const thread=el('section','thread');thread.setAttribute('aria-label','Conversation for '+card.title);
 const head=el('div','thread-head');head.append(el('span',null,'conversation'));
 if(unread(card))head.append(button('Mark replies read','quiet',()=>markRepliesRead(card)));
 thread.append(head);
 const expanded=state.threads.has(card.id),items=el('ol','messages');items.id='messages-'+card.id;
 (expanded?list:list.slice(-3)).forEach(m=>{const item=el('li','message message-'+m.who);item.setAttribute('aria-label',m.who==='ted'?'Ted':'Sebastian');if(m.who==='ted')item.append(el('span','message-label','ted'));item.append(el('p',null,m.text));items.append(item)});thread.append(items);
 if(list.length>3){const toggle=button(expanded?'show less':'show all ('+list.length+')','quiet thread-toggle',()=>{if(expanded)state.threads.delete(card.id);else{state.threads.add(card.id);state.readCards.add(card.id);storage.set('ted-board-read:'+card.id,replyMarker(card))}render()});toggle.setAttribute('aria-expanded',String(expanded));toggle.setAttribute('aria-controls',items.id);thread.append(toggle)}
 return thread;
}
const mockups=new MockupsView({el,button,storage,getKey:()=>key,onChange:()=>{if(state.project==='Mockups')render();else renderTabs()},notify:announce,isSelected:()=>state.project==='Mockups'});
function renderTabs(){
 const tabs=$('tabs');tabs.replaceChildren();
 const projects=['All','Mockups',...PROJECTS,...new Set(state.cards.map(c=>c.project).filter(p=>p&&!PROJECTS.includes(p)&&!['Jobs','Mockups'].includes(p))),'Jobs'];
 projects.forEach((p,i)=>{
  const b=button(p,'tab',()=>selectProject(p));b.setAttribute('role','tab');b.id='project-'+i;b.setAttribute('aria-controls','main');b.setAttribute('aria-selected',String(p===state.project));b.tabIndex=p===state.project?0:-1;
  const n=p==='Mockups'?0:state.cards.filter(c=>c.section==='needs_you'&&(p==='All'||p===c.project)).length;
  const hasUnread=p==='Mockups'?mockups.hasUnread():state.cards.some(c=>(p==='All'||p===c.project)&&unread(c));
  if(n||hasUnread){const count=el('span','tab-count',p==='Mockups'?'':n);if(hasUnread)count.append(replyDot());b.append(count)}
  if(hasUnread)b.setAttribute('aria-description','Unread replies from Ted');
  b.setAttribute('aria-label',p);
  b.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?projects.length-1:(i+(e.key==='ArrowRight'?1:-1)+projects.length)%projects.length;selectProject(projects[next]);$('tabs').children[next].focus()});
  tabs.append(b);
 });
 $('main').setAttribute('aria-labelledby','project-'+projects.indexOf(state.project));
}
function selectProject(p){state.project=p;render();if(p==='Jobs')loadJobs();if(p==='Mockups'&&!mockups.loaded&&!mockups.loading)mockups.load();$('tabs').querySelector('[aria-selected=true]')?.scrollIntoView({block:'nearest',inline:'nearest'});}
function answerText(card){
 const a=card.answer;if(!a)return '';
 if(a.action==='stuck'||a.choice==='stuck')return 'Help requested'+(Number.isInteger(a.step_index)?' on step '+(a.step_index+1):'');
 if(a.choice==='ted_do_it')return 'Handed to Ted';
 if(a.choice==='steps_done')return 'All steps finished';
 if(a.action==='move'||String(a.choice).startsWith('move:'))return 'Moved to '+({needs_you:'Needs you',ted_doing:'Ted’s doing',up_next:'Up next',done:'Done',killed:'Killed'}[a.value||String(a.choice).slice(5)]||'another section');
 if(a.choice==='note')return a.note||'Note sent';
 return options(card).find(o=>o.value===a.choice)?.label||String(a.choice||'Answer sent');
}
function renderCard(card){
 const article=el('article','card');article.dataset.cardId=card.id;article.setAttribute('aria-label',card.title);
 const top=el('div','card-top');top.append(el('span','chip',card.project));if(unread(card))top.append(replyDot('card-unread'));
 const wrap=el('div','move-wrap');const move=el('select');move.setAttribute('aria-label','Move card');
 const placeholder=el('option',null,'Move');placeholder.value='';placeholder.disabled=true;placeholder.selected=true;move.append(placeholder);
 [['ted_doing','In progress'],['done','Done'],['killed','Killed'],['up_next','Up next']].forEach(([value,label])=>{const o=el('option',null,label);o.value=value;move.append(o)});
 move.addEventListener('change',async()=>{const value=move.value;move.value='';await act(card,'move',value)});wrap.append(move);const chevron=document.createElementNS('http://www.w3.org/2000/svg','svg');chevron.setAttribute('viewBox','0 0 24 24');chevron.setAttribute('aria-hidden','true');const line=document.createElementNS(chevron.namespaceURI,'path');line.setAttribute('d','m7 10 5 5 5-5');chevron.append(line);wrap.append(chevron);top.append(wrap);article.append(top,el('h3',null,card.title));
 if(card.body)article.append(el('p','card-body',card.body));
 const image=safeURL(card.image_url);if(image){const img=el('img','thumb');img.src=image;img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.addEventListener('error',()=>img.remove());article.append(img)}
 const opts=options(card);if(opts.length){const row=el('div','options');opts.forEach(o=>row.append(button(o.label,'option',()=>act(card,'choice',o.value))));article.append(row)}
 const form=el('form','note-form');const text=el('textarea');text.setAttribute('aria-label','Answer for '+card.title);text.placeholder='or just tell me…';text.maxLength=2000;text.rows=1;text.value=state.drafts[card.id]||'';text.addEventListener('input',()=>state.drafts[card.id]=text.value);
 const send=button('Send','',()=>{});send.type='submit';form.append(text,send);form.addEventListener('submit',e=>{e.preventDefault();if(!text.value.trim()){text.focus();announce('Write a note first.',true);return}act(card,'note','',text.value.trim())});article.append(form);
 const bottom=el('div','card-footer');bottom.append(button('Ted, you do it','quiet delegate',()=>act(card,'ted_do_it')));
 if(steps(card).length){const play=button('▶  Steps','play',()=>openGuide(card));play.setAttribute('aria-label','Play guided steps');bottom.append(play)}article.append(bottom);
 if(card.answer){const answer=el('div','answer');const copy=el('div');copy.append(el('p',null,answerText(card)));if(card.answer.note&&card.answer.choice!=='note'&&card.answer.choice!=='stuck')copy.append(el('p','card-body',card.answer.note));answer.append(copy,el('span','sent','sent ✓'));article.append(answer)}
 renderApprovals(card,article);
 const thread=renderThread(card);if(thread)article.append(thread);
 if(state.busy.has(card.id))article.querySelectorAll('button,select,textarea').forEach(e=>e.disabled=true);
 return article;
}
function render(){
 renderTabs();const main=$('main');main.replaceChildren();
 if(!key){renderAccess();return}
 if(state.project==='Mockups'){mockups.render(main);return}
 if(!state.loaded){main.append(el('p','loading',state.loading?'Opening your board…':'Your board could not be loaded. Tap Refresh to try again.'));return}
 if(state.project==='Jobs'){renderJobs(main);return}
 const cards=projectCards();const n=cards.filter(c=>c.section==='needs_you').length;
 const intro=el('div','board-intro');const introText=el('div');introText.append(el('h2',null,state.project==='All'?'what i need from you':state.project));const sub=el('p',null,state.project==='All'?(n===1?'just one thing.':n?n+' things, quick ones mostly.':'nothing on you right now. go live a little.'):'your calls, what i\'m on, and what\'s next.');sub.style.marginTop='8px';introText.append(sub);intro.append(introText);main.append(intro);
 const board=el('div','board'+(state.project==='All'?' all':''));
 if(state.project==='All'&&!cards.length){const clear=el('div','state');clear.append(el('h2',null,'You’re all clear.'),el('p',null,'Ted can keep moving. Open a project to see what’s in progress, or come back when there’s a new decision.'));board.append(clear)}
 (state.project==='All'?[SECTIONS[0]]:SECTIONS).forEach(([id,label])=>{
  const matching=cards.filter(c=>c.section===id&&(id!=='done'||recent(c)||unread(c)||state.readCards.has(c.id)));
  if(state.project==='All'&&!matching.length)return;
  const section=el('section','section');section.dataset.section=id;const heading=el('div','section-heading');heading.append(el('h2',null,label),el('span','count',matching.length));if(id==='done')heading.append(el('span','count','last 7 days + unread'));section.append(heading);
  if(matching.length)matching.forEach(c=>section.append(renderCard(c)));else section.append(el('p','empty-section',({needs_you:'nothing on you here.',ted_doing:'nothing running here right now.',up_next:'nothing queued yet.',done:'nothing shipped this week yet.'})[id]));board.append(section);
 });
 if(state.project!=='All'){const killed=cards.filter(c=>c.section==='killed');const d=el('details','killed');const sum=el('summary');sum.append(el('span',null,'Killed'),el('span','count',killed.length));if(killed.some(unread))sum.append(replyDot());d.append(sum);if(killed.length)killed.forEach(c=>d.append(renderCard(c)));else d.append(el('p','empty-section','nothing killed.'));board.append(d)}
 main.append(board);
}
function renderAccess(){
 const main=$('main');main.replaceChildren();const box=el('section','state');box.append(el('h2',null,'Your board, one private link.'),el('p',null,'Open the personal link Ted gave you, or paste it below. Access is remembered on this device.'));
 const form=el('form','key-form');const input=el('input');input.type='password';input.autocomplete='off';input.placeholder='Private link or access key';input.setAttribute('aria-label','Private link or access key');input.required=true;const submit=button('Open board','primary',()=>{});submit.type='submit';form.append(input,submit);form.addEventListener('submit',e=>{e.preventDefault();let value=input.value.trim();try{const u=new URL(value);value=new URLSearchParams(u.hash.slice(1)).get('k')||''}catch{}if(!value){announce('Paste the full private link or its access key.',true);return}key=value;if(!storage.set('ted-board-key',key))history.replaceState(null,'',location.pathname+location.search+'#k='+encodeURIComponent(key));state.loaded=false;state.cards=[];mockups.reset();mockups.load();load()});box.append(form);main.append(box);
}
async function api(method,body,resource=''){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),20000);
 try{const r=await fetch(ENDPOINT+(method==='GET'?'?key='+encodeURIComponent(key)+(resource?'&resource='+encodeURIComponent(resource):''):''),{method,headers:method==='GET'?{}:{'Content-Type':'text/plain'},body:body?JSON.stringify({key,...body}):undefined,cache:'no-store',referrerPolicy:'no-referrer',signal:controller.signal});let data;try{data=await r.json()}catch{throw new Error('The service returned an unreadable response. Try again.')}
 if(!r.ok){if(r.status===403)throw new Error('Access key not accepted. Tap Access to open your private link again.');throw new Error(data.error||'Could not save. Try again.')}
 return data;
 }catch(e){if(e.name==='AbortError')throw new Error('The connection timed out. Refresh to check whether your answer arrived.');if(e instanceof TypeError)throw new Error('Could not connect. Check your connection and try again.');throw e}finally{clearTimeout(timeout)}
}
async function load(){
 if(!key){render();return}if(state.loading)return;state.loading=true;const revision=state.revision;$('refresh').disabled=true;announce('');render();
 try{const data=await api('GET');if(!Array.isArray(data.cards))throw new Error('Could not read your cards. Try refreshing.');if(revision!==state.revision)return;state.cards=data.cards;state.loaded=true;render();loadJobs();const time=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('refresh').title='Updated '+time;announce(storageUnavailable?'Storage is unavailable. Keep your private link to reopen this board.':'')}
 catch(e){announce(e.message,true);render()}finally{state.loading=false;$('refresh').disabled=false}
}
function setCardBusy(id,busy){if(busy)state.busy.add(id);else state.busy.delete(id);document.querySelectorAll('[data-card-id]').forEach(e=>{if(e.dataset.cardId===id)e.querySelectorAll('button,select,textarea').forEach(c=>c.disabled=busy)})}
async function act(card,action,value='',note=''){
 if(state.busy.has(card.id))return false;setCardBusy(card.id,true);announce('Saving…');
 try{const data=await api('POST',{card_id:card.id,action,value,note});if(!data.ok||!data.card)throw new Error('Save was not confirmed. Refresh to check your answer.');state.revision++;const i=state.cards.findIndex(c=>c.id===card.id);if(i>=0)state.cards[i]=data.card;if(action==='note')delete state.drafts[card.id];render();announce(action==='stuck'?'Ted has your note.':action==='steps_done'?'All steps finished. Sent to Ted.':'Sent to Ted.');return true}
 catch(e){announce(e.message,true);if(state.guide)$('guide-status').textContent=e.message;return false}
 finally{setCardBusy(card.id,false)}
}
function renderApprovals(card,article){
 for(const a of state.approvals.filter(a=>a.card_id===card.id)){
  const box=el('section','approval');box.setAttribute('aria-label','Approval needed');box.append(el('p',null,a.summary),el('p','card-body',a.status==='pending'?'Your approval is needed.':'Approved. Waiting for the safety review.'));
  const details=el('details');details.dataset.approvalId=a.id;const summary=el('summary',null,'Exact content');details.append(summary,el('pre',null,a.content));box.append(details);
  if(a.status==='pending'){const actions=el('div','job-actions');actions.append(button('Approve','primary',()=>control('approval',{approval_id:a.id,decision:'approve'})),button('Reject','',()=>control('approval',{approval_id:a.id,decision:'reject'})));box.append(actions)}article.append(box);
 }
}
async function loadJobs(){
 if(!key||state.jobsLoading)return;state.jobsLoading=true;
 try{const data=await api('GET',undefined,'jobs');state.jobs=Array.isArray(data.jobs)?data.jobs:[];state.approvals=Array.isArray(data.approvals)?data.approvals:[];state.jobsLoaded=true;
 // Preserve the open artifact views and drafts during polling.
 const opened=[...document.querySelectorAll('[data-approval-id][open]')].map(e=>e.dataset.approvalId);
 const focused=document.activeElement;const editing=focused&&['TEXTAREA','INPUT','SELECT'].includes(focused.tagName);
 if(!editing&&!state.busy.size){render();document.querySelectorAll('[data-approval-id]').forEach(e=>{if(opened.includes(e.dataset.approvalId))e.open=true})}
 }catch(e){if(state.project==='Jobs')announce(e.message,true)}finally{state.jobsLoading=false}
}
async function control(action,body){
 try{await api('POST',{action,...body});announce(action==='kill'?'Stop requested. The mini will process it on its next heartbeat.':'Decision saved.');await loadJobs()}catch(e){announce(e.message,true)}
}
function renderJobs(main){
 const intro=el('div','board-intro');intro.append(el('h2',null,'Jobs'),el('p',null,'Refreshes every 10 seconds'));main.append(intro);
 const list=el('div','job-list');const active=state.jobs.filter(j=>['running','queued','waiting_approval','untracked'].includes(j.status));
 if(!state.jobsLoaded)list.append(el('p','status','Loading jobs…'));else if(!active.length)list.append(el('p','status','No active jobs.'));
 for(const j of active){const box=el('article','card');box.append(el('h3',null,j.title));const age=j.started_at?Math.max(0,Math.floor((Date.now()/1000-j.started_at)/60))+' min':'not started';box.append(el('p','job-meta',j.engine+' · '+j.status+' · '+age));box.append(el('p','card-body',j.last_line||'Waiting for activity'));
  const stale=!j.heartbeat_at||Date.now()-Date.parse(j.heartbeat_at)>120000;if(stale)box.append(el('p','job-warning','Mini heartbeat is stale. Controls will wait for it to reconnect.'));
  const actions=el('div','job-actions');const kill=button('Kill','',()=>control('kill',{job_id:j.id,pid:j.pid??null,identity:j.identity||''}));kill.disabled=stale;actions.append(kill);
  if(j.card_id)actions.append(button('Open','',()=>openJobCard(j.card_id)));box.append(actions);list.append(box)
 }main.append(list);
}
function openJobCard(id){
 const card=state.cards.find(c=>c.id===id);if(!card){announce('Card is no longer available. Refresh the board.',true);return}state.project=card.project;state.readCards.add(id);render();const target=[...document.querySelectorAll('[data-card-id]')].find(e=>e.dataset.cardId===id);if(target){const parent=target.closest('details');if(parent)parent.open=true;target.scrollIntoView({block:'center',behavior:'smooth'});target.tabIndex=-1;target.focus({preventScroll:true})}
}
setInterval(()=>{if(key&&!document.hidden)loadJobs()},10000);
function progressKey(card){return 'ted-board-steps:'+card.id}
function signature(card){return JSON.stringify(steps(card))}
function saveProgress(){const g=state.guide;if(g){const saved=storage.set(progressKey(g.card),JSON.stringify({index:g.index,signature:signature(g.card)}));$('guide-save-status').textContent=saved?'close anytime, i\'ll keep your spot.':'Storage is unavailable. Your place is kept for this session.'}}
function openGuide(card){
 const list=steps(card);if(!list.length)return;let index=0;try{const saved=JSON.parse(storage.get(progressKey(card))||'null');if(saved?.signature===signature(card)&&Number.isInteger(saved.index))index=Math.max(0,Math.min(list.length-1,saved.index))}catch{}
 state.guide={card,index,sending:false};$('step-note').value='';$('guide-status').textContent='';drawGuide();$('guide').showModal();saveProgress();$('step-text').focus();
}
function drawGuide(){
 const g=state.guide;if(!g)return;const list=steps(g.card),step=list[g.index];$('guide-project').textContent=g.card.project;$('guide-heading').textContent=g.card.title;$('step-count').textContent='Step '+(g.index+1)+' of '+list.length;$('step-text').textContent=step.text;$('guide-back').disabled=g.index===0||g.sending;$('guide-next').textContent=g.index===list.length-1?'Finish':'Done, next';
 $('guide-progress').replaceChildren(...list.map((_,i)=>el('span','progress-segment'+(i<=g.index?' active':''))));$('guide-link').replaceChildren();const link=safeURL(step.link);if(link){const a=el('a','open-link','Open link');a.href=link;a.target='_blank';a.rel='noopener noreferrer';$('guide-link').append(a)}
}
function closeGuide(){if(state.guide?.sending)return;saveProgress();$('guide').close();state.guide=null}
$('guide-close').addEventListener('click',closeGuide);
$('guide').addEventListener('cancel',e=>{if(state.guide?.sending)e.preventDefault();else{saveProgress();state.guide=null}});
$('guide-back').addEventListener('click',()=>{const g=state.guide;if(!g||g.sending||!g.index)return;g.index--;saveProgress();$('guide-status').textContent='';drawGuide();$('step-text').focus()});
$('guide-next').addEventListener('click',async()=>{const g=state.guide;if(!g||g.sending)return;if(g.index<steps(g.card).length-1){g.index++;saveProgress();$('guide-status').textContent='';drawGuide();$('step-text').focus();return}await guideSend('steps_done')});
$('guide-stuck').addEventListener('click',()=>guideSend('stuck'));
async function guideSend(action){
 const g=state.guide;if(!g||g.sending)return;g.sending=true;$('guide').querySelectorAll('button,textarea').forEach(b=>b.disabled=true);$('guide-status').textContent='Sending to Ted…';
 const ok=await act(g.card,action,action==='stuck'?g.index:'',$('step-note').value.trim());
 g.sending=false;$('guide').querySelectorAll('button,textarea').forEach(b=>b.disabled=false);
 if(ok&&action==='steps_done'){storage.remove(progressKey(g.card));$('guide').close();state.guide=null;$('main').focus();return}
 if(ok)$('guide-status').textContent='Ted has your note. You can keep going or close this for now.';drawGuide();
}
$('refresh').addEventListener('click',()=>state.project==='Mockups'?mockups.load():load());
$('change-key').addEventListener('click',()=>{if(state.busy.size||state.loading||mockups.busy.size)return;announce('');renderAccess()});
window.addEventListener('online',()=>{if(key&&!state.busy.size)load()});
render();if(key){load();mockups.load();}
</script>
</body>
</html>
