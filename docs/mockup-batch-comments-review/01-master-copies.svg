<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:25px;font-weight:700}.small{font-size:14px}.line{fill:none;stroke:#111;stroke-width:2}</style><text x="24" y="36" class="title">Master-copy study: three patterns from the existing Ted Board</text><text x="24" y="80" class="small">Existing batch controls</text><rect x="24" y="100" width="360" height="510" fill="#fff" stroke="#111" stroke-width="2"/><rect x="40" y="120" width="170" height="42" fill="#111" stroke="#111" stroke-width="2"/><text x="49" y="185" class="small">Good to go: whole batch</text><rect x="40" y="210" width="328" height="300" fill="#f2f2f2" stroke="#111" stroke-width="2"/><text x="54" y="540" class="small">Frames follow the controls</text><text x="420" y="80" class="small">Existing pin conversation</text><rect x="420" y="100" width="360" height="510" fill="#fff" stroke="#111" stroke-width="2"/><rect x="436" y="120" width="328" height="86" fill="#f2f2f2" stroke="#111" stroke-width="2"/><text x="450" y="160" class="small">Sebastian: Can we shorten this?</text><rect x="436" y="222" width="328" height="90" fill="#fff" stroke="#111" stroke-width="2"/><text x="450" y="262" class="small">Ted: I will keep the short copy.</text><rect x="436" y="332" width="328" height="90" fill="#fff" stroke="#111" stroke-width="2"/><text x="450" y="370" class="small">Reply textarea</text><rect x="436" y="440" width="100" height="42" fill="#fff" stroke="#111" stroke-width="2"/><text x="816" y="80" class="small">Existing Archive controls</text><rect x="816" y="100" width="360" height="510" fill="#fff" stroke="#111" stroke-width="2"/><rect x="1012" y="120" width="148" height="42" fill="#fff" stroke="#111" stroke-width="2"/><text x="1026" y="148" class="small">Archive batch</text><rect x="832" y="210" width="328" height="220" fill="#f2f2f2" stroke="#111" stroke-width="2"/><rect x="832" y="450" width="328" height="70" fill="#111" stroke="#111" stroke-width="2"/><text x="846" y="550" class="small">Undo is kept outside the image</text></svg>