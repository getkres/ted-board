name: Report review state regressions

on:
  pull_request:
    paths:
      - 'runner-fix/reconciler*'
      - 'runner-fix/report_review_status_test.py'
      - '.github/workflows/report-review-state.yml'
  push:
    branches: [main]
    paths:
      - 'runner-fix/reconciler*'
      - 'runner-fix/report_review_status_test.py'
      - '.github/workflows/report-review-state.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 runner-fix/report_review_status_test.py
