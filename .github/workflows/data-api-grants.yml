name: Data API grants

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_data_api_grants.py'
      - run: python3 scripts/check_data_api_grants.py
      - run: python3 runner-fix/legacy_dispatch_pause_test.py
      - run: python3 runner-fix/legacy_pause_control_test.py
