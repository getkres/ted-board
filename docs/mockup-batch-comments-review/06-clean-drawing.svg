<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:25px;font-weight:700}.small{font-size:14px}.line{fill:none;stroke:#111;stroke-width:2}</style><text x="24" y="36" class="title">Clean underdrawing: two-pixel structure, quiet thread, and one Send action</text><text x="24" y="82" class="small">Chosen #2: no sidebar, no extra modal, and no new header chrome</text><rect x="24" y="100" width="1120" height="520" fill="#fff" stroke="#111" stroke-width="2"/><rect x="48" y="124" width="210" height="44" fill="#fff" stroke="#111" stroke-width="2"/><text x="64" y="152" class="small">Good to go: whole batch</text><rect x="968" y="124" width="152" height="44" fill="#fff" stroke="#111" stroke-width="2"/><text x="980" y="152" class="small">Archive batch</text><text x="48" y="205" class="small">BATCH COMMENTS</text><rect x="48" y="228" width="1072" height="120" fill="#f2f2f2" stroke="#111" stroke-width="2"/><text x="64" y="260" class="small">You: Keep the shorter headline across this batch.</text><text x="64" y="310" class="small">Ted: I will use that headline for the next pass.</text><rect x="48" y="364" width="1072" height="88" fill="#fff" stroke="#111" stroke-width="2"/><text x="64" y="398" class="small">Comment on this batch</text><rect x="48" y="468" width="94" height="44" fill="#fff" stroke="#111" stroke-width="2"/><text x="65" y="496" class="small">Send</text></svg>