'use strict';
const ENDPOINT='https://wqnrortftkffmbeugjky.supabase.co/functions/v1/ted-board';
const POD_PULSE_ERROR='Pod updates could not load. Refresh to try again.';
const SECTIONS=[['needs_you','Needs you'],['ted_doing',"Ted’s doing"],['up_next','Up next'],['done','Done']];
const $=id=>document.getElementById(id);
const state={cards:[],podPulse:[],podPulseError:false,openPods:new Set(),jobs:[],approvals:[],reconciliation:null,jobsLoaded:false,loadError:'',jobsError:'',jobsLoading:false,jobsRequestId:0,freshRequestId:0,project:'All',loaded:false,loading:false,loadRequestId:0,busy:new Set(),drafts:Object.create(null),guide:null,revision:0,threads:new Set(),readCards:new Set()};
const memory=new Map();let storageUnavailable=false;
const storage={get(k){try{return localStorage.getItem(k)??memory.get(k)??null}catch{storageUnavailable=true;return memory.get(k)??null}},set(k,v){memory.set(k,v);try{localStorage.setItem(k,v);return true}catch{storageUnavailable=true;return false}},remove(k){memory.delete(k);try{localStorage.removeItem(k)}catch{storageUnavailable=true}}};
let key=storage.get('ted-board-key')||'';
const fragment=new URLSearchParams(location.hash.slice(1));
const fragmentKey=fragment.get('k');
if(fragmentKey){key=fragmentKey;storage.set('ted-board-key',key)}
function deepTab(value){return ControlCenterV3.route(value)}
state.project=deepTab(fragment.get('tab'));

let freshState=null,freshSending=false;

 let url='https://claude.ai/code';
 try{const u=new URL(raw);if(u.origin==='https://claude.ai'&&!u.username&&!u.password&&!u.search&&!u.hash&&/^\/code(?:\/session_[A-Za-z0-9_-]+)?\/?$/.test(u.pathname))url=u.href}catch{}
 $('talk-ted').href=url;
}
function freshDoneRecently(){const stamp=Date.parse(freshState?.completed_at||freshState?.finished_at||freshState?.updated_at||'');const age=Date.now()-stamp;return Number.isFinite(stamp)&&age>=0&&age<600000}
function renderFresh(){
 const health=state.jobs.find(j=>j.id==='fresh-ted-health');
 const stale=health&&(!health.heartbeat_at||!Number.isFinite(Date.parse(health.heartbeat_at))||Date.now()-Date.parse(health.heartbeat_at)>120000);
 const warning=stale?'Live Ted health is stale. Check the mini.':health?.status==='failed'?(health.last_line||'Live Ted is offline. Start fresh Ted.'):'';
 const alert=$('ted-health');alert.hidden=!warning;if(alert.textContent!==warning)alert.textContent=warning;
 alert.style.color='var(--red, #b42318)';
 const b=$('fresh-ted');const pending=freshSending||['pending','running'].includes(freshState?.status);b.disabled=!key||!freshState||pending;b.classList.toggle('due',freshState?.due===true);b.setAttribute('aria-busy',String(pending));
 $('fresh-status').textContent=freshState?.status==='failed'?(freshState.error||'Fresh Ted could not start. Tap the red button to retry.'):pending?(freshState?.stage||'Requesting fresh Ted…'):freshState?.status==='done'&&!warning&&freshDoneRecently()?'Fresh Ted is up. Open the new Ted chat.':'';
}
$('fresh-ted').addEventListener('click',async()=>{
 if(freshSending||['pending','running'].includes(freshState?.status))return;
 if(!confirm('start a fresh ted?'))return;
 freshSending=true;const requestId=++state.freshRequestId,requestKey=key;renderFresh();
 try{const result=await api('POST',{action:'fresh_request'});if(requestId!==state.freshRequestId||requestKey!==key)return;freshState=result;announce('Fresh Ted requested. I’ll handle the handoff.')}
 catch(e){if(requestId===state.freshRequestId&&requestKey===key)announce(e.message,true)}
 finally{if(requestId===state.freshRequestId&&requestKey===key){freshSending=false;renderFresh()}}
});
window.addEventListener('hashchange',()=>{const params=new URLSearchParams(location.hash.slice(1));const next=params.get('k');if(next&&next!==key){key=next;storage.set('ted-board-key',key);resetForKeyChange();mockups.reset();load();mockups.load()}state.project=deepTab(params.get('tab'));render();if(key)loadJobs();if(key&&['inbox','Control'].includes(state.project))controlCenter.load()});
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}

function localToday(){
 const now=new Date(Date.now());
 return [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
}
function validPodDate(raw){
 if(typeof raw!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(raw))return false;
 const stamp=Date.parse(raw+'T00:00:00Z');
 return Number.isFinite(stamp)&&new Date(stamp).toISOString().slice(0,10)===raw;
}
function podNextReadLabel(raw){
 return validPodDate(raw)&&raw<localToday()?'Read overdue: ':'Next read: ';
}
function podShippedLabel(raw){
 if(!validPodDate(raw))return 'Shipped in snapshot';
 return 'Shipped on '+raw;
}
function podAge(raw){

function renderApprovals(card,article){
 for(const a of state.approvals.filter(a=>a.card_id===card.id)){
  const box=el('section','approval');box.setAttribute('aria-label','Approval needed');box.append(el('p',null,a.summary),el('p','card-body',a.status==='pending'?'Your approval is needed.':'Approved. Waiting for the safety review.'));
  const details=el('details');details.dataset.approvalId=a.id;const summary=el('summary',null,'Exact content');details.append(summary,el('pre',null,a.content));box.append(details);
  if(a.status==='pending'){const actions=el('div','job-actions');actions.append(button('Approve','primary',()=>control('approval',{approval_id:a.id,decision:'approve'})),button('Reject','',()=>control('approval',{approval_id:a.id,decision:'reject'})));box.append(actions)}article.append(box);
 }
}
async function loadJobs(){
 if(!key||state.jobsLoading)return;state.jobsLoading=true;state.jobsError='';const requestId=++state.jobsRequestId,requestKey=key;
 try{const data=await api('GET',undefined,'jobs');if(requestId!==state.jobsRequestId||requestKey!==key)return;freshState=data.fresh_ted||null;updateTedChat(data.ted_chat_url);state.jobs=Array.isArray(data.jobs)?data.jobs:[];renderFresh();state.approvals=Array.isArray(data.approvals)?data.approvals:[];state.reconciliation=data.reconciliation&&typeof data.reconciliation==='object'?data.reconciliation:null;state.jobsLoaded=true;renderAgingBanner();renderTabs();
 // Preserve the open artifact views and drafts during polling.
 const opened=[...document.querySelectorAll('details[open]:not(.pod-row)')].map(e=>e.dataset.approvalId||e.className);
 const focused=document.activeElement;const editing=focused&&['TEXTAREA','INPUT','SELECT'].includes(focused.tagName);
 /* Mockups shows no jobs data, so a rebuild there only resets the swipe the viewer is in. */
 if(ControlCenterV3.isMockups(state.project))renderFresh();
 else if(!editing&&!state.busy.size){render();document.querySelectorAll('details:not(.pod-row)').forEach(e=>{if(opened.includes(e.dataset.approvalId||e.className))e.open=true})}
 }catch(e){if(requestId===state.jobsRequestId&&requestKey===key){state.jobsError=e.message;state.jobsLoaded=false;renderAgingBanner();if(state.project==='Jobs'||decide.active()){announce(e.message,true);render();}}}finally{if(requestId===state.jobsRequestId&&requestKey===key)state.jobsLoading=false}
}
async function control(action,body,transport={}){
 if(action==='approval'){const cardId=state.approvals.find(a=>a.id===body.approval_id)?.card_id;if(cardId)decide.cancelQueued(cardId);}
 const requestKey=key,generation=v3.generation;
 try{const data=await api('POST',{action,...body},'',transport);if(requestKey!==key||generation!==v3.generation)return false;if(!data.ok)throw new Error('Decision was not confirmed. Refresh to check it.');announce(action==='kill'?'Stop requested. The mini will process it on its next heartbeat.':'Decision saved.');if(action==='approval')await load(true);else await loadJobs();return true}catch(e){if(requestKey===key&&generation===v3.generation)announce(e.message,true);return false}
}
function renderJobs(main){
 const intro=el('div','board-intro');intro.append(el('h2',null,'Jobs'),el('p',null,'Refreshes every 10 seconds'));main.append(intro);
 AgingWip.render(main,agingView(),{onOpenCard:openJobCard});
 const laneRows=state.jobs.filter(j=>j.lane_summary===true&&['claude-lane-main','claude-lane-design','claude-lane-research'].includes(j.id));
 if(laneRows.length){
  const lanes=el('section','claude-lanes');lanes.setAttribute('aria-label','Claude account lanes');lanes.append(el('h3',null,'Claude account lanes'),el('p','job-meta','Usage from dispatched jobs only. Plan-wide usage unavailable from CLI.'));
  const rows=el('div','job-list');
  for(const j of laneRows){
   const row=el('article','card claude-lane-summary');const names={'claude-lane-main':'Account 1: Ted and interactive work','claude-lane-design':j.lane_role==='all_managed'?'Account 2: all Claude and Sonnet workers':'Account 2: design, art, and other workers','claude-lane-research':'Account 3: research, analysis, and review gates'};
   row.append(el('h4',null,names[j.id]),el('p','job-meta',j.last_line||'Limit status unknown'));
   const usage=j.lane_usage||{},valid=n=>Number.isFinite(n)&&n>=0&&typeof n==='number';
   const counts=[['input_tokens','input'],['output_tokens','output'],['cache_read_input_tokens','cache read'],['cache_creation_input_tokens','cache write']].filter(([key])=>valid(usage[key])).map(([key,label])=>usage[key].toLocaleString()+' '+label);
   const tokenText=counts.length>1?counts.slice(0,-1).join(', ')+(counts.length>2?', and ':' and ')+counts[counts.length-1]:counts[0];
   row.append(el('p','card-body',counts.length?'Observed tokens: '+tokenText+'.':'Usage not yet observed.'));
   if(valid(usage.observed_at))row.append(el('p','job-meta','Last observed '+new Date(usage.observed_at*1000).toLocaleString()));
   if(valid(usage.resets_at)&&usage.resets_at*1000>Date.now())row.append(el('p','job-meta','Reset reported for '+new Date(usage.resets_at*1000).toLocaleString()));
   if(!j.heartbeat_at||Date.now()-Date.parse(j.heartbeat_at)>120000||!Number.isFinite(Date.parse(j.heartbeat_at)))row.append(el('p','job-warning','Mini heartbeat is stale. Lane status may be out of date.'));
   rows.append(row);
  }
  lanes.append(rows);main.append(lanes);
 }
 const counts=BoardStatus.workerCounts(state.cards,state.jobs,state.jobsLoaded);main.append(el('p','work-summary jobs-work-summary',counts?counts.running+' running · '+counts.queued+' queued · '+counts.stale+' stale in Ted doing':'Checking workers'));
 const list=el('div','job-list');const active=state.jobs.filter(j=>j.id!=='fresh-ted-health'&&j.lane_summary!==true&&['running','queued','waiting_approval','untracked'].includes(j.status));
 if(!state.jobsLoaded)list.append(el('p','status','Loading jobs…'));else if(!active.length)list.append(el('p','status','No active jobs.'));
 for(const j of active){const box=el('article','card');box.dataset.status=j.status;box.append(el('h3',null,j.title));const age=j.started_at?Math.max(0,Math.floor((Date.now()/1000-j.started_at)/60))+' min':'not started';box.append(el('p','job-meta',(j.worker_engine==='sonnet'?'sonnet':j.engine)+' · '+j.status+' · '+age));box.append(el('p','card-body',j.last_line||'Waiting for activity'));
  const stale=!j.heartbeat_at||Date.now()-Date.parse(j.heartbeat_at)>120000;if(stale)box.append(el('p','job-warning','Mini heartbeat is stale. Controls will wait for it to reconnect.'));
  const actions=el('div','job-actions');const kill=button('Kill','',()=>control('kill',{job_id:j.id,pid:j.pid??null,identity:j.identity||''}));kill.disabled=stale;actions.append(kill);
  if(j.card_id)actions.append(button('Open','',()=>openJobCard(j.card_id)));box.append(actions);list.append(box)
 }main.append(list);
}
function openJobCard(id){
 const card=state.cards.find(c=>c.id===id);if(!card){announce('Card is no longer available. Refresh the board.',true);return}state.project=card.project;saveTab();state.readCards.add(id);render();const target=[...document.querySelectorAll('[data-card-id]')].find(e=>e.dataset.cardId===id);if(target){const parent=target.closest('details');if(parent)parent.open=true;target.scrollIntoView({block:'center',behavior:'smooth'});target.tabIndex=-1;target.focus({preventScroll:true})}
}
setInterval(()=>{if(key&&!document.hidden)loadJobs()},10000);
function progressKey(card){return 'ted-board-steps:'+card.id}
function signature(card){return JSON.stringify(steps(card))}
function saveProgress(){const g=state.guide;if(g){const saved=storage.set(progressKey(g.card),JSON.stringify({index:g.index,signature:signature(g.card)}));$('guide-save-status').textContent=saved?'close anytime, i\'ll keep your spot.':'Storage is unavailable. Your place is kept for this session.'}}
function openGuide(card){
 const list=steps(card);if(!list.length)return;let index=0;try{const saved=JSON.parse(storage.get(progressKey(card))||'null');if(saved?.signature===signature(card)&&Number.isInteger(saved.index))index=Math.max(0,Math.min(list.length-1,saved.index))}catch{}
 state.guide={card,index,sending:false};$('step-note').value='';$('guide-status').textContent='';drawGuide();$('guide').showModal();saveProgress();$('step-text').focus();
}
function drawGuide(){
 const g=state.guide;if(!g)return;const list=steps(g.card),step=list[g.index];$('guide-project').textContent=g.card.project;$('guide-heading').textContent=g.card.title;$('step-count').textContent='Step '+(g.index+1)+' of '+list.length;$('step-text').textContent=step.text;$('guide-back').disabled=g.index===0||g.sending;$('guide-next').textContent=g.index===list.length-1?'Finish':'Done, next';
 $('guide-progress').replaceChildren(...list.map((_,i)=>el('span','progress-segment'+(i<=g.index?' active':''))));$('guide-link').replaceChildren();const link=safeURL(step.link);if(link){const a=el('a','open-link','Open link');a.href=link;a.target='_blank';a.rel='noopener noreferrer';$('guide-link').append(a)}
}
function closeGuide(){if(state.guide?.sending)return;saveProgress();$('guide').close();state.guide=null}
$('guide-close').addEventListener('click',closeGuide);
$('guide').addEventListener('cancel',e=>{if(state.guide?.sending)e.preventDefault();else{saveProgress();state.guide=null}});
$('guide-back').addEventListener('click',()=>{const g=state.guide;if(!g||g.sending||!g.index)return;g.index--;saveProgress();$('guide-status').textContent='';drawGuide();$('step-text').focus()});
$('guide-next').addEventListener('click',async()=>{const g=state.guide;if(!g||g.sending)return;if(g.index<steps(g.card).length-1){g.index++;saveProgress();$('guide-status').textContent='';drawGuide();$('step-text').focus();return}await guideSend('steps_done')});
$('guide-stuck').addEventListener('click',()=>guideSend('stuck'));
async function guideSend(action){
 const g=state.guide;if(!g||g.sending)return;g.sending=true;$('guide').querySelectorAll('button,textarea').forEach(b=>b.disabled=true);$('guide-status').textContent='Sending to Ted…';
 const ok=await act(g.card,action,action==='stuck'?g.index:'',$('step-note').value.trim());
 g.sending=false;$('guide').querySelectorAll('button,textarea').forEach(b=>b.disabled=false);
 if(ok&&action==='steps_done'){storage.remove(progressKey(g.card));$('guide').close();state.guide=null;$('main').focus();return}
 if(ok)$('guide-status').textContent='Ted has your note. You can keep going or close this for now.';drawGuide();
}
const v3=new ControlCenterV3({el,button,api,getState:()=>state,getKey:()=>key,mockups,renderCard,select:selectProject,redraw:render,notice:announce,storage,deciding:()=>decide.active()});
mockups.v3=v3;
const controlCenter=new ControlCenter({api,getCards:()=>state.cards,answer:act,reloadCards:load,redraw:render,notice:announce,select:()=>{state.project='Control';saveTab();render()}});
const decide=new DecideStack({el,button,storage,getState:()=>state,getKey:()=>key,options,needsYou:card=>v3.needsYou(card),inboxQueue:()=>v3.inboxQueue(),skipCard:card=>v3.skipCard(card),skipOrder:()=>v3.skipOrder,wasSkipped:card=>v3.skipped.has(card.id),projectCount:card=>v3.inboxGroups().find(group=>group.cards.some(c=>c.id===card.id))?.cards.length||0,answer:act,approve:(payload,transport)=>control('approval',{approval_id:payload.approval_id,decision:payload.decision},transport),refresh:()=>load(true),access:()=>renderAccess(),select:selectProject,redraw:render,notice:announce,renderThread,safeURL,openCard:card=>{v3.item=card.id;v3.split='yours';render()}});
function positionTedControls(){const nav=document.querySelector('.tab-wrap');nav.classList.toggle('under-controls',nav.getBoundingClientRect().top<=0)}
window.addEventListener('scroll',positionTedControls,{passive:true});
window.addEventListener('pageshow',positionTedControls);
window.addEventListener('resize',positionTedControls);
positionTedControls();
$('refresh').addEventListener('click',()=>{if(ControlCenterV3.isMockups(state.project))mockups.load();else{load();if(state.project==='Control')controlCenter.load()}});
$('change-key').addEventListener('click',()=>{if(state.busy.size||state.loading||mockups.busy.size)return;announce('');renderAccess()});
window.addEventListener('pagehide',()=>decide.flush());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')decide.flush();});
window.addEventListener('online',()=>{if(key&&!state.busy.size)load()});
v3.setup();$('refresh').before(button('Decide','decide-entry',()=>decide.view('decide')));render();if(key){load();mockups.load();controlCenter.load()}
</script>
